# Bouwt het dashboard opnieuw en publiceert het op GitHub Pages.
# Er is geen R-server nodig: Quarto levert statische HTML, en Pages serveert die.
#
# Eenmalig instellen in de repo: Settings > Pages > Source = GitHub Actions.

name: Dashboard bouwen en publiceren

on:
  schedule:
    - cron: "0 6 * * 1"    # elke maandag 06:00 UTC: nieuwe data ophalen
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readODS
            any::dplyr
            any::tidyr
            any::purrr
            any::stringr
            any::readr
            any::janitor
            any::tibble
            any::ggplot2
            any::scales
            any::glue
            any::knitr
            any::svglite
            any::ragg
            any::rmarkdown

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Keten draaien en dashboard renderen
        run: Rscript run_all.R

      # Nieuwe brondata vastleggen, zodat je een versiehistorie opbouwt.
      #
      # Deze stap mag de publicatie nooit tegenhouden: het dashboard is al
      # gebouwd en staat als artifact klaar. Vandaar `continue-on-error`.
      #
      # `pull --rebase` is nodig omdat er tussen het uitchecken en het pushen
      # iets op main gepusht kan zijn - door jou, of door een eerdere run van
      # deze workflow. Zonder die stap weigert Git de push met
      # "Updates were rejected because the remote contains work that you do
      # not have locally".
      - name: Wijziging in brondata vastleggen
        continue-on-error: true
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"

          git add -f data/raw/bronblad_ruw_*.rds data/raw/bronblad_ruw_*.csv

          if git diff --staged --quiet; then
            echo "Geen wijziging in de brondata."
            exit 0
          fi

          git commit -m "Brondata bijgewerkt $(date +%Y-%m-%d)"

          # Eerst halen wat er inmiddels op main staat, dan pas duwen.
          git pull --rebase origin main || {
            echo "Rebase mislukt; brondata niet vastgelegd. Het dashboard"
            echo "wordt wel gewoon gepubliceerd."
            exit 0
          }

          git push origin main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
